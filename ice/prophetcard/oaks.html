<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cardstyle.css">
</head>
<body>
    <div id="content">
    <header>
        <h1>Prophet Card</h1>
    </header>
    <body>
        <div id="card">
        <h2> Dallin H. Oaks</h2>
        <h3> 18th President of the Church of Jesus Christ of Latter-Day Saints</h3>
        <a id="imglink" href="https://www.churchofjesuschrist.org/?lang=eng">
            <img class="photo" src="dallin_oaks.jpg" alt="President Oaks" max-width="300">
        </a>
        <div id="list">
        <ul>
            <li> <p>Born: Aug 12, 1932</p></li>
            <li> <p>Apostle: Apr 7, 1984</p></li>
            <li> <p>Prophet: Oct 14, 2025</p></li>
        </ul>
        </div>
        <H4>"The Gospel of Jesus Christ teaches us 
            <br>that our highest priority is to love god 
            <br>and to love our fellowmen."</H4>
        </div>
    </body>
    </div>
</body>
</html>
